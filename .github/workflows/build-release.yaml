name: Create new release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The whole history, so a build after a tag finds it: the go command
        # names the version after the last tag, and without one in reach
        # reports v0.0.0. The token stays out of .git/config: nothing after
        # the checkout needs it there, and .git goes into the build.
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Same flags as the Dockerfile: CGO off, giving a static, self-contained
      # binary.
      - name: Build (amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: >
          go build -trimpath -ldflags='-s -w'
          -o "keyosk-${{ github.ref_name }}.linux-x86_64"
          ./cmd/server

      - run: file keyosk-*

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: keyosk-*
          fail_on_unmatched_files: true
          generate_release_notes: true
